name: Deploy UI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - name: Build UI for Pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${PAGES_BASE_PATH}/"
      - name: Verify compiled entry point
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; const html=readFileSync('dist/index.html','utf8'); if(html.includes('/src/') || !html.includes('/assets/')) throw new Error('Expected built assets, not source HTML');"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment