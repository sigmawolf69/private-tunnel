name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build website
        run: npm run build
        env:
          VITE_MEDIA_ORIGIN: https://animeidhentai.com
          VITE_VIDEOS_URL: ${{ vars.VITE_VIDEOS_URL || '/videos.json' }}
          VITE_GALLERY_MANIFEST_URL: ${{ vars.VITE_GALLERY_MANIFEST_URL }}

      - name: Verify deployable output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'Build output incorrectly references the TSX source entry.'
            exit 1
          fi
          grep -q '/assets/index-' dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
